<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="GymAI splash">
  <defs>
    <radialGradient id="sglow" cx="50%" cy="43%" r="55%">
      <stop offset="0%" stop-color="#0e1422"/>
      <stop offset="62%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="shalo" cx="50%" cy="43%" r="30%">
      <stop offset="0%" stop-color="#5fe3f0" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5fe3f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sglow)"/>
  <circle cx="540" cy="820" r="330" fill="url(#shalo)"/>
  <!-- Wordmark centré (mark + texte), groupe mis à l'échelle ~2.35 -->
  <g transform="translate(270,760) scale(2.35)">
    <g transform="translate(0,4)">
      <rect width="48" height="48" rx="14" fill="#5fe3f0"/>
      <g fill="#06222a">
        <rect x="6" y="20" width="4" height="8" rx="2"/>
        <rect x="11" y="17" width="4.5" height="14" rx="2.2"/>
        <rect x="15" y="22" width="18" height="4" rx="2"/>
        <rect x="32.5" y="17" width="4.5" height="14" rx="2.2"/>
        <rect x="38" y="20" width="4" height="8" rx="2"/>
      </g>
    </g>
    <text x="62" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="-1.2">
      <tspan fill="#eef2f8">Gym</tspan><tspan fill="#5fe3f0">AI</tspan>
    </text>
  </g>
  <text x="540" y="1030" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="34" fill="#8b93a4">Ton coach intelligent, à chaque répétition.</text>
</svg>
